<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dota 2 — Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container mt-4">
    <h3>Вход</h3>

    <form onsubmit="enterSite(event)">
      <label>Email</label>
      <input type="email" class="form-control mb-2" required>
      <label>Пароль</label>
      <input type="password" class="form-control mb-2" required>
      <button type="submit" class="btn btn-primary">Войти</button>
    </form>

    <hr>

    <h3>Регистрация</h3>

    <form onsubmit="enterSite(event)">
      <label>Никнейм</label>
      <input type="text" class="form-control mb-2" required>
      <label>Email</label>
      <input type="email" class="form-control mb-2" required>
      <label>Пароль</label>
      <input type="password" class="form-control mb-2" required>
      <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function enterSite(e) {
      e.preventDefault();
      window.location.href = "heroes.html";
    }
  </script>
</body>
</html>
