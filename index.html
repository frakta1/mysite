<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dota 2 — Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0f141a; color: #dfe6ee; }
    .card { background: #151d26; border: 1px solid #263241; color: #dfe6ee; }
  </style>
</head>
<body>
  <div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card p-4 p-md-5" style="max-width:420px; width:100%;">
      <h1 class="text-center mb-1">DOTA 2</h1>
      <p class="text-center text-secondary mb-4">Гайд для новичков</p>

      <ul class="nav nav-pills nav-justified mb-4">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#loginPane">Вход</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="pill" data-bs-target="#regPane">Регистрация</button>
        </li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="loginPane">
          <form onsubmit="enterSite(event)">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control bg-dark text-light border-secondary" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Пароль</label>
              <input type="password" class="form-control bg-dark text-light border-secondary" required>
            </div>
            <button type="submit" class="btn btn-info w-100">Войти</button>
          </form>
        </div>
        <div class="tab-pane fade" id="regPane">
          <form onsubmit="enterSite(event)">
            <div class="mb-3">
              <label class="form-label">Никнейм</label>
              <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="Твой ник" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control bg-dark text-light border-secondary" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Пароль</label>
              <input type="password" class="form-control bg-dark text-light border-secondary" required>
            </div>
            <button type="submit" class="btn btn-danger w-100">Зарегистрироваться</button>
          </form>
        </div>
      </div>

      <p class="text-center mt-4 mb-0 small text-secondary">
        Учебный проект. Данные никуда не отправляются.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function enterSite(e) {
      e.preventDefault();
      window.location.href = "heroes.html";
    }
  </script>
</body>
</html>
